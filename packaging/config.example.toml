# Copie para ~/.config/ktsentinel-guard/config.toml e rode: chmod 600 config.toml
# NUNCA commite o arquivo preenchido.
[general]
armed = true
# data_dir = "~/.local/share/ktsentinel-guard"
notify = true                  # false = só registra eventos (ajuste da detecção)
cooldown_seconds = 60          # intervalo mínimo entre notificações da mesma câmera
min_event_seconds = 2          # movimento precisa durar isso para notificar
event_gap_seconds = 5          # sem movimento por este tempo encerra o evento
require_person = false   # true: só notifica se pessoa confirmada (exige person_filter)
max_notifications_per_hour = 6

# Agenda opcional (vazia = só o arm/disarm manual). Dias: 0=segunda ... 6=domingo.
# [[schedule]]
# days = [0, 1, 2, 3, 4]
# start = "08:00"
# end = "18:00"

[fcm]
project_id = "SEU-PROJECT-ID"
service_account_file = "~/.config/ktsentinel-guard/fcm-service-account.json"
topic = "sentinel_00000000000000000000000000000000"   # o mesmo tópico que o app assina
title = "kTsentinel - Casa"

[ntfy]            # reserva opcional
enabled = false
url = "https://ntfy.sh/seu-topico-secreto"

[detection]
# Filtro de pessoa (rode scripts/download_models.sh). O MOG2 acorda, o modelo confirma só quando há movimento.
person_filter = false
person_confidence = 0.5
sensitivity = 5            # 1-10
min_area_pct = 0.5
min_consecutive_frames = 3
fps = 5
history = 500
warmup_seconds = 10

[[cameras]]
id = 1
name = "Quintal"
rtsp_url = "rtsp://IP_DVR:554/user=USUARIO&password=SENHA&channel=1&stream=0.sdp"
rtsp_url_secondary = "rtsp://IP_DVR:554/user=USUARIO&password=SENHA&channel=1&stream=1.sdp"
is_active = true
# Zonas: polígonos [[x,y],...] normalizados (0..1). Ignore: rua visível pelo portão, relógio do DVR.
# ignore_zones = [[[0.27,0.10],[0.90,0.10],[0.90,0.60],[0.27,0.60]]]
# include_zones = []   # se preenchido, só estas áreas contam

# Análise por câmera (exige [detection].person_filter = true). Coordenadas normalizadas 0..1.
# [[cameras]] ...
# loiter_seconds = 30                       # pessoa na cena (ou em loiter_zone) por 30 s => alerta
# loiter_zone = [[0.1,0.4],[0.9,0.4],[0.9,0.95],[0.1,0.95]]   # opcional
# [[cameras.tripwires]]
# name = "portão"
# line = [[0.5,0.0],[0.5,1.0]]
# direction = "both"                        # both | ab | ba
