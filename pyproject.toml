[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-guard"
version = "0.1.2"
description = "kTsentinel Guard: detecção de movimento em câmeras RTSP com alertas FCM"
requires-python = ">=3.11"
dependencies = ["numpy", "requests", "google-auth"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sentinel-guard = "sentinel_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_guard = ["web.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
